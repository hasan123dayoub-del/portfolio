<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Hasan Dayoub</title>
    <style>
      :root { --bg: #fafafa; --text: #52525b; --h: #09090b; --accent: #0e7490; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0d12; --text: #a1a1aa; --h: #f4f4f5; --accent: #22d3ee; }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 12px;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      h1 { margin: 0; font-size: 72px; color: var(--accent); }
      h2 { margin: 0; color: var(--h); }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for does not exist.</p>
    <p><a href="/portfolio/">Back to the portfolio</a></p>
  </body>
</html>
